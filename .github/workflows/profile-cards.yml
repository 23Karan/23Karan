name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=23Karan&show_icons=true&hide_border=true&theme=default&rank_icon=github&include_all_commits=true"
          path: profile/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=23Karan&layout=compact&langs_count=8&hide_border=true&theme=default"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=23Karan&theme=default&hide_border=true&disable_animations=true&background=ffffff&ring=31506f&fire=31506f&currStreakLabel=31506f&sideLabels=31506f&dates=667085"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub trophies locally
        run: |
          mkdir -p profile
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git /tmp/github-profile-trophy
          deno run --allow-net --allow-env --allow-read --allow-write \
            /tmp/github-profile-trophy/render_svg.ts 23Karan profile/trophies.svg flat

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
